<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0b1f1a">
<title>Solar Live</title>
<style>
  :root{
    --bg: #0b1f1a;
    --bg-card: #102b23;
    --bg-card-2: #133328;
    --line: #1d4537;
    --sun: #ffb84d;
    --sun-soft: #6b4a1f;
    --green: #5fd99c;
    --green-dim: #2f6b53;
    --text: #eef7f1;
    --text-dim: #8fb3a3;
    --text-faint: #5d8073;
    --danger: #ff7a6b;
    --font-display: 'Space Grotesk', 'Segoe UI', system-ui, sans-serif;
    --font-body: 'Inter', 'Segoe UI', system-ui, sans-serif;
    --font-mono: 'JetBrains Mono', 'SF Mono', monospace;
  }

  *{ box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html, body{
    margin:0; padding:0;
    background: var(--bg);
    color: var(--text);
    font-family: var(--font-body);
    min-height: 100vh;
    overscroll-behavior-y: contain;
  }

  body{
    background-image:
      radial-gradient(circle at 50% -10%, rgba(255,184,77,0.10), transparent 55%),
      radial-gradient(circle at 100% 110%, rgba(95,217,156,0.06), transparent 60%);
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  }

  .wrap{
    max-width: 480px;
    margin: 0 auto;
    padding: 20px 16px 100px;
  }

  /* Header */
  header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom: 22px;
    padding: 4px 2px;
  }
  .brand{
    display:flex;
    align-items:center;
    gap:10px;
  }
  .brand-mark{
    width: 34px; height:34px;
    border-radius: 9px;
    background: linear-gradient(150deg, var(--sun), #d98c1f);
    display:flex; align-items:center; justify-content:center;
    flex-shrink:0;
    box-shadow: 0 4px 14px rgba(255,184,77,0.25);
  }
  .brand-mark svg{ width:19px; height:19px; }
  .brand-text h1{
    font-family: var(--font-display);
    font-size: 17px;
    font-weight:600;
    letter-spacing: 0.2px;
    margin:0;
    line-height:1.1;
  }
  .brand-text p{
    margin:2px 0 0;
    font-size: 11px;
    color: var(--text-faint);
    letter-spacing: 0.3px;
  }
  .status-dot{
    width:8px;height:8px;border-radius:50%;
    background: var(--green);
    display:inline-block;
    margin-right:6px;
    box-shadow: 0 0 0 0 rgba(95,217,156,0.6);
    animation: pulse 2.4s infinite;
  }
  .status-dot.offline{ background: var(--danger); animation:none; box-shadow:none;}
  @keyframes pulse{
    0%{ box-shadow: 0 0 0 0 rgba(95,217,156,0.45);}
    70%{ box-shadow: 0 0 0 7px rgba(95,217,156,0);}
    100%{ box-shadow: 0 0 0 0 rgba(95,217,156,0);}
  }
  .pill{
    font-size: 10.5px;
    color: var(--text-dim);
    display:flex;
    align-items:center;
    background: rgba(95,217,156,0.07);
    border: 1px solid var(--green-dim);
    border-radius: 100px;
    padding: 5px 10px 5px 8px;
    white-space:nowrap;
  }

  /* Gauge card */
  .card{
    background: linear-gradient(165deg, var(--bg-card), var(--bg-card-2));
    border: 1px solid var(--line);
    border-radius: 22px;
    padding: 24px 20px 20px;
    margin-bottom: 16px;
    position: relative;
    overflow:hidden;
  }
  .card-label{
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 1.4px;
    color: var(--text-faint);
    font-weight: 600;
    margin: 0 0 2px;
  }

  .gauge-wrap{
    display:flex;
    flex-direction:column;
    align-items:center;
    padding-top: 6px;
  }
  .gauge-svg{ width: 100%; max-width: 320px; height:auto; display:block; }
  .gauge-value{
    font-family: var(--font-display);
    font-weight: 700;
    fill: var(--text);
  }
  .gauge-unit{
    font-family: var(--font-body);
    fill: var(--text-dim);
    font-weight:500;
  }
  .gauge-sub{
    fill: var(--text-faint);
    font-family: var(--font-body);
  }

  .stat-row{
    display:grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 8px;
    margin-top: 14px;
  }
  .stat{
    background: rgba(255,255,255,0.025);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 10px 8px;
    text-align:center;
  }
  .stat-num{
    font-family: var(--font-mono);
    font-size: 15px;
    font-weight:600;
    color: var(--text);
    line-height:1.2;
  }
  .stat-lbl{
    font-size: 9.5px;
    color: var(--text-faint);
    text-transform: uppercase;
    letter-spacing: 0.6px;
    margin-top: 3px;
  }

  /* Chart card */
  .chart-card{
    background: linear-gradient(165deg, var(--bg-card), var(--bg-card-2));
    border: 1px solid var(--line);
    border-radius: 22px;
    padding: 20px 16px 14px;
    margin-bottom: 16px;
  }
  .chart-head{
    display:flex;
    justify-content:space-between;
    align-items:baseline;
    margin-bottom: 10px;
    padding: 0 4px;
  }
  .chart-head .card-label{ margin:0; }
  .chart-peak{
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--sun);
  }
  .chart-svg{ width:100%; height: auto; display:block; }
  .chart-axis-label{
    fill: var(--text-faint);
    font-size: 9px;
    font-family: var(--font-mono);
  }

  /* Footer / meta */
  .meta-row{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding: 4px 6px 0;
    font-size: 11px;
    color: var(--text-faint);
  }
  .meta-row b{ color: var(--text-dim); font-weight:600; }

  /* Refresh button (fixed) */
  .refresh-bar{
    position: fixed;
    left:0; right:0; bottom:0;
    display:flex;
    justify-content:center;
    padding: 14px 16px calc(16px + env(safe-area-inset-bottom));
    background: linear-gradient(to top, rgba(11,31,26,0.97) 60%, rgba(11,31,26,0));
    pointer-events:none;
  }
  .refresh-btn{
    pointer-events:all;
    width:100%;
    max-width: 448px;
    background: linear-gradient(135deg, var(--sun), #e09a2c);
    color: #1a1206;
    border:none;
    border-radius: 16px;
    padding: 15px 0;
    font-family: var(--font-display);
    font-size: 15px;
    font-weight: 700;
    letter-spacing: 0.2px;
    display:flex;
    align-items:center;
    justify-content:center;
    gap: 8px;
    box-shadow: 0 8px 22px rgba(255,184,77,0.28), 0 2px 4px rgba(0,0,0,0.3);
    transition: transform 0.15s ease, box-shadow 0.15s ease;
  }
  .refresh-btn:active{
    transform: scale(0.97);
    box-shadow: 0 4px 12px rgba(255,184,77,0.22);
  }
  .refresh-btn.loading svg{
    animation: spin 0.9s linear infinite;
  }
  .refresh-btn:disabled{ opacity: 0.75; }
  @keyframes spin{ to{ transform: rotate(360deg); } }

  .error-banner{
    background: rgba(255,122,107,0.1);
    border: 1px solid rgba(255,122,107,0.35);
    color: #ffb3a8;
    border-radius: 14px;
    padding: 12px 14px;
    font-size: 12.5px;
    line-height:1.45;
    margin-bottom: 16px;
    display:none;
  }
  .error-banner.show{ display:block; }
  .error-banner b{ color:#ffd4cc; }
  .error-banner code{
    background: rgba(0,0,0,0.25);
    padding: 1px 5px;
    border-radius:5px;
    font-size:11px;
    word-break: break-all;
  }

  .skeleton{
    color: var(--text-faint);
    text-align:center;
    padding: 30px 0 10px;
    font-size: 13px;
  }

  ::selection{ background: var(--green-dim); }
</style>
</head>
<body>

<div class="wrap">

  <header>
    <div class="brand">
      <div class="brand-mark">
        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <circle cx="12" cy="12" r="4.2" fill="#1a1206"/>
          <g stroke="#1a1206" stroke-width="1.8" stroke-linecap="round">
            <line x1="12" y1="2" x2="12" y2="4.6"/>
            <line x1="12" y1="19.4" x2="12" y2="22"/>
            <line x1="2" y1="12" x2="4.6" y2="12"/>
            <line x1="19.4" y1="12" x2="22" y2="12"/>
            <line x1="4.9" y1="4.9" x2="6.7" y2="6.7"/>
            <line x1="17.3" y1="17.3" x2="19.1" y2="19.1"/>
            <line x1="4.9" y1="19.1" x2="6.7" y2="17.3"/>
            <line x1="17.3" y1="6.7" x2="19.1" y2="4.9"/>
          </g>
        </svg>
      </div>
      <div class="brand-text">
        <h1>Solar Live</h1>
        <p id="plantLabel">Anlage wird geladen…</p>
      </div>
    </div>
    <div class="pill"><span class="status-dot" id="statusDot"></span><span id="statusText">verbinde…</span></div>
  </header>

  <div class="error-banner" id="errorBanner"></div>

  <!-- GAUGE CARD -->
  <div class="card">
    <p class="card-label">Aktuelle Leistung</p>
    <div class="gauge-wrap">
      <svg class="gauge-svg" id="gaugeSvg" viewBox="0 0 320 200"></svg>
    </div>
    <div class="stat-row">
      <div class="stat">
        <div class="stat-num" id="statToday">–</div>
        <div class="stat-lbl">Heute</div>
      </div>
      <div class="stat">
        <div class="stat-num" id="statMonth">–</div>
        <div class="stat-lbl">Monat</div>
      </div>
      <div class="stat">
        <div class="stat-num" id="statTotal">–</div>
        <div class="stat-lbl">Gesamt</div>
      </div>
    </div>
  </div>


  <div class="meta-row">
    <span>Letzte Aktualisierung: <b id="lastUpdate">–</b></span>
    <span id="nextUpdate"></span>
  </div>

</div>

<div class="refresh-bar">
  <button class="refresh-btn" id="refreshBtn">
    <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
      <polyline points="23 4 23 10 17 10"></polyline>
      <polyline points="1 20 1 14 7 14"></polyline>
      <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path>
    </svg>
    <span id="refreshLabel">Daten aktualisieren</span>
  </button>
</div>

<script>
/* ============================================================
   KONFIGURATION
   ============================================================ */
const DIRECT_URL = "/.netlify/functions/solar";
const PROXY_URLS = [];
const AUTO_REFRESH_MS = 5 * 60 * 1000; // 5 Minuten

/* ============================================================
   STATE
   ============================================================ */
let autoTimer = null;
let countdownTimer = null;
let secondsToNext = AUTO_REFRESH_MS / 1000;
let maxPowerSeenToday = 0;

/* ============================================================
   HELPERS
   ============================================================ */
function unescapeHtml(str){
  return str
    .replace(/&quot;/g, '"')
    .replace(/&amp;/g, '&')
    .replace(/&lt;/g, '<')
    .replace(/&gt;/g, '>')
    .replace(/&#39;/g, "'");
}

function fmtTime(d){
  return d.toLocaleTimeString('de-DE', { hour:'2-digit', minute:'2-digit', second:'2-digit' });
}

function fmtNum(v, decimals=2){
  if (v === null || v === undefined || isNaN(v)) return '–';
  return Number(v).toLocaleString('de-DE', { minimumFractionDigits: decimals, maximumFractionDigits: decimals });
}

// Leistungswert + passende Einheit automatisch bestimmen, analog zum Original-Dashboard.
// FusionSolar liefert realTimePower meist bereits in kW.
function formatPower(kwValue){
  const kw = Number(kwValue);
  if (isNaN(kw)) return { value: '–', unit: 'kW' };
  if (Math.abs(kw) < 1) {
    return { value: fmtNum(kw * 1000, 0), unit: 'W' };
  }
  if (Math.abs(kw) >= 1000) {
    return { value: fmtNum(kw / 1000, 2), unit: 'MW' };
  }
  return { value: fmtNum(kw, 2), unit: 'kW' };
}

/* ============================================================
   DATEN HOLEN
   ============================================================ */
async function fetchRaw(url){
  const res = await fetch(url, { cache: 'no-store' });
  if (!res.ok) throw new Error(`HTTP ${res.status}`);
  const text = await res.text();
  return text;
}

async function fetchKioskData(){
    const text = await fetchRaw(DIRECT_URL);
    return parseKioskResponse(text);
}

function parseKioskResponse(rawText){
  let outer;
  try{
    outer = JSON.parse(rawText);
  }catch(e){
    // manche Proxys liefern das JSON evtl. schon doppelt verschachtelt als reinen Text
    throw new Error('Antwort konnte nicht als JSON gelesen werden');
  }

  if (!outer || outer.success === false){
    throw new Error(outer && outer.failCode ? `Server meldet Fehler ${outer.failCode}` : 'Unbekannter Serverfehler');
  }

  let dataStr = outer.data;
  if (typeof dataStr !== 'string'){
    // falls schon ein Objekt
    return normalizeData(dataStr);
  }

  const unescaped = unescapeHtml(dataStr);
  const parsed = JSON.parse(unescaped);
  return normalizeData(parsed);
}

function normalizeData(d){
  // Erwartete Struktur (laut FusionSolar Kiosk API):
  // d.realKpi = { realTimePower, cumulativeEnergy, monthEnergy, dailyEnergy, yearEnergy }
  // d.stationName / d.name
  // mögliche Kurven-Felfer: d.curveInfo / d.xy / d.power_curve / d.dataList o.ä. — wir suchen robust.
  const realKpi = d.realKpi || d.realKpiData || {};

  let curve = null;
  const curveCandidates = ['curveInfo','xy','powerCurve','curve','dataList','realKpiCurve','chartData'];
  for (const key of curveCandidates){
    if (d[key]) { curve = d[key]; break; }
  }

  return {
    stationName: d.stationName || d.name || d.stationDvName || 'Meine PV-Anlage',
    realTimePower: parseFloat(realKpi.realTimePower),
    dailyEnergy: parseFloat(realKpi.dailyEnergy),
    monthEnergy: parseFloat(realKpi.monthEnergy),
    yearEnergy: parseFloat(realKpi.yearEnergy),
    cumulativeEnergy: parseFloat(realKpi.cumulativeEnergy),
    rawCurve: curve,
    rawFull: d
  };
}

/* ============================================================
   KURVE EXTRAHIEREN -> [{x:"HH:MM", y:kW}, ...]
   ============================================================ */
function extractCurvePoints(curve){
  if (!curve) return [];

  // Fall 1: Array von Objekten mit time/value-ähnlichen Feldern
  if (Array.isArray(curve)){
    return curve.map(pt => {
      if (Array.isArray(pt)) {
        return { t: pt[0], v: parseFloat(pt[1]) };
      }
      const t = pt.time || pt.x || pt.xValue || pt.collectTime || pt.t;
      const vRaw = pt.value ?? pt.y ?? pt.yValue ?? pt.v ?? pt.power;
      return { t, v: parseFloat(vRaw) };
    }).filter(p => p.t !== undefined && !isNaN(p.v));
  }

  // Fall 2: { xAxis: [...], series: [{data:[...]}] } – Highcharts/Echarts-ähnlich
  if (curve.xAxis && curve.series){
    const x = curve.xAxis;
    const series = Array.isArray(curve.series) ? curve.series[0] : curve.series;
    const y = series.data || series.values || [];
    return x.map((t, i) => ({ t, v: parseFloat(y[i]) })).filter(p => !isNaN(p.v));
  }

  // Fall 3: { xy: { x:[...], y:[...] } }
  if (curve.x && curve.y){
    return curve.x.map((t, i) => ({ t, v: parseFloat(curve.y[i]) })).filter(p => !isNaN(p.v));
  }

  return [];
}

/* ============================================================
   GAUGE RENDERING (SVG Tacho, 0–270° Bogen)
   ============================================================ */
function renderGauge(currentKw, capacityHintKw){
  const svg = document.getElementById('gaugeSvg');
  const cx = 160, cy = 150, r = 110;

  // Skalenmaximum: dynamisch, etwas über dem höchsten bisher gesehenen Wert,
  // mit sinnvollem Minimum, damit die Nadel nicht immer am Anschlag steht.
  let maxScale = capacityHintKw && capacityHintKw > 0 ? capacityHintKw * 1.15 : Math.max(maxPowerSeenToday * 1.25, 1);
  if (currentKw > maxScale) maxScale = currentKw * 1.15;
  maxScale = Math.max(maxScale, 0.5);

  const startAngle = -210; // Grad
  const endAngle = 30;
  const span = endAngle - startAngle;

  function angleFor(value){
    const ratio = Math.min(Math.max(value / maxScale, 0), 1);
    return startAngle + ratio * span;
  }
  function polarToXY(angleDeg, radius){
    const rad = (angleDeg * Math.PI) / 180;
    return { x: cx + radius * Math.cos(rad), y: cy + radius * Math.sin(rad) };
  }
  function arcPath(a0, a1, radius){
    const p0 = polarToXY(a0, radius);
    const p1 = polarToXY(a1, radius);
    const largeArc = (a1 - a0) > 180 ? 1 : 0;
    return `M ${p0.x} ${p0.y} A ${radius} ${radius} 0 ${largeArc} 1 ${p1.x} ${p1.y}`;
  }

  const valueAngle = angleFor(currentKw);
  const trackPath = arcPath(startAngle, endAngle, r);
  const fillPath = arcPath(startAngle, valueAngle, r);

  const { value, unit } = formatPower(currentKw);

  // Tick-Marken
  const tickCount = 6;
  let ticks = '';
  for (let i=0;i<=tickCount;i++){
    const a = startAngle + (span * i/tickCount);
    const p1 = polarToXY(a, r+10);
    const p2 = polarToXY(a, r+2);
    ticks += `<line x1="${p1.x}" y1="${p1.y}" x2="${p2.x}" y2="${p2.y}" stroke="#2a5c4a" stroke-width="2" stroke-linecap="round"/>`;
  }

  svg.innerHTML = `
    <defs>
      <linearGradient id="gaugeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
        <stop offset="0%" stop-color="#5fd99c"/>
        <stop offset="55%" stop-color="#ffd166"/>
        <stop offset="100%" stop-color="#ffb84d"/>
      </linearGradient>
      <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
        <feGaussianBlur stdDeviation="4" result="blur"/>
        <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
      </filter>
    </defs>
    <path d="${trackPath}" fill="none" stroke="#1d4537" stroke-width="16" stroke-linecap="round"/>
    ${ticks}
    <path d="${fillPath}" fill="none" stroke="url(#gaugeGrad)" stroke-width="16" stroke-linecap="round" filter="url(#glow)"/>
    <text x="${cx}" y="${cy - 6}" text-anchor="middle" class="gauge-value" font-size="42">${value}</text>
    <text x="${cx}" y="${cy + 24}" text-anchor="middle" class="gauge-unit" font-size="15">${unit}</text>
    <text x="${cx}" y="${cy + 52}" text-anchor="middle" class="gauge-sub" font-size="11">Skala bis ${fmtNum(maxScale,1)} kW</text>
  `;
}

/* ============================================================
   LINIENCHART RENDERING
   ============================================================ */
function renderChart(points){
  const container = document.getElementById('chartContainer');
  const peakLabel = document.getElementById('chartPeak');

  if (!points || points.length < 2){
    container.innerHTML = `<div class="skeleton">Keine Verlaufsdaten in der API-Antwort gefunden.</div>`;
    peakLabel.textContent = '';
    return;
  }

  const W = 320, H = 160, padL = 6, padR = 6, padT = 16, padB = 22;
  const innerW = W - padL - padR;
  const innerH = H - padT - padB;

  const values = points.map(p => p.v);
  const maxV = Math.max(...values, 0.1);
  const minV = 0;

  maxPowerSeenToday = Math.max(maxPowerSeenToday, maxV);

  const n = points.length;
  const stepX = innerW / (n - 1);

  const coords = points.map((p, i) => {
    const x = padL + i * stepX;
    const y = padT + innerH - ((p.v - minV) / (maxV - minV || 1)) * innerH;
    return { x, y, t: p.t, v: p.v };
  });

  const linePath = coords.map((c,i) => `${i===0?'M':'L'} ${c.x.toFixed(1)} ${c.y.toFixed(1)}`).join(' ');
  const areaPath = `${linePath} L ${coords[coords.length-1].x.toFixed(1)} ${padT+innerH} L ${coords[0].x.toFixed(1)} ${padT+innerH} Z`;

  // X-Achsenbeschriftung: ca 5 Labels über den Tag verteilt
  const labelIdxs = [0, Math.floor(n*0.25), Math.floor(n*0.5), Math.floor(n*0.75), n-1];
  let axisLabels = '';
  labelIdxs.forEach(i => {
    const c = coords[i];
    const label = (points[i].t || '').toString().slice(0,5);
    axisLabels += `<text x="${c.x}" y="${H-4}" text-anchor="middle" class="chart-axis-label">${label}</text>`;
  });

  // Peak-Marker
  const peakIdx = values.indexOf(maxV);
  const peakC = coords[peakIdx];

  const { value: peakVal, unit: peakUnit } = formatPower(maxV);
  peakLabel.textContent = `Peak ${peakVal} ${peakUnit}`;

  const svgHtml = `
    <svg class="chart-svg" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">
      <defs>
        <linearGradient id="areaGrad" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#ffb84d" stop-opacity="0.35"/>
          <stop offset="100%" stop-color="#ffb84d" stop-opacity="0"/>
        </linearGradient>
      </defs>
      <line x1="${padL}" y1="${padT}" x2="${W-padR}" y2="${padT}" stroke="#1d4537" stroke-width="1"/>
      <line x1="${padL}" y1="${padT+innerH/2}" x2="${W-padR}" y2="${padT+innerH/2}" stroke="#1d4537" stroke-width="1" stroke-dasharray="3,4"/>
      <line x1="${padL}" y1="${padT+innerH}" x2="${W-padR}" y2="${padT+innerH}" stroke="#1d4537" stroke-width="1"/>
      <path d="${areaPath}" fill="url(#areaGrad)"/>
      <path d="${linePath}" fill="none" stroke="#ffb84d" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
      <circle cx="${peakC.x}" cy="${peakC.y}" r="3.5" fill="#ffd166" stroke="#0b1f1a" stroke-width="1.5"/>
      ${axisLabels}
    </svg>
  `;
  container.innerHTML = svgHtml;
}

/* ============================================================
   UI UPDATE
   ============================================================ */
function setStatus(online, text){
  const dot = document.getElementById('statusDot');
  const t = document.getElementById('statusText');
  dot.classList.toggle('offline', !online);
  t.textContent = text;
}

function showError(msg){
  const el = document.getElementById('errorBanner');
  el.innerHTML = msg;
  el.classList.add('show');
}
function hideError(){
  document.getElementById('errorBanner').classList.remove('show');
}

function updateUI(data){
  document.getElementById('plantLabel').textContent = data.stationName;

  renderGauge(isNaN(data.realTimePower) ? 0 : data.realTimePower);

  document.getElementById('statToday').textContent =
    !isNaN(data.dailyEnergy) ? fmtNum(data.dailyEnergy,1) + ' kWh' : '–';
  document.getElementById('statMonth').textContent =
    !isNaN(data.monthEnergy) ? fmtNum(data.monthEnergy / 1000, 2) + ' MWh' : '–';
  document.getElementById('statTotal').textContent =
    !isNaN(data.cumulativeEnergy) ? fmtNum(data.cumulativeEnergy / 1000, 2) + ' MWh' : '–';


  const now = new Date();
  document.getElementById('lastUpdate').textContent = fmtTime(now);
  setStatus(true, 'live');
  hideError();
}

/* ============================================================
   REFRESH FLOW
   ============================================================ */
async function doRefresh(manual){
  const btn = document.getElementById('refreshBtn');
  const label = document.getElementById('refreshLabel');

  btn.classList.add('loading');
  btn.disabled = true;
  if (manual) label.textContent = 'Aktualisiere…';
  setStatus(true, 'lade…');

  try{
    const data = await fetchKioskData();
    updateUI(data);
  }catch(e){
    console.error(e);
    setStatus(false, 'Fehler');
    showError(`<b>Verbindung zum Dashboard fehlgeschlagen.</b><br>${e.message || e}<br><br>Mögliche Gründe: der Kiosk-Link ist abgelaufen, oder dein Netzwerk/Browser blockiert den Zugriff. Du kannst es mit dem Button erneut versuchen.`);
  }finally{
    btn.classList.remove('loading');
    btn.disabled = false;
    label.textContent = 'Daten aktualisieren';
    resetCountdown();
  }
}

/* ============================================================
   AUTO-REFRESH COUNTDOWN
   ============================================================ */
function resetCountdown(){
  secondsToNext = AUTO_REFRESH_MS / 1000;
}

function tickCountdown(){
  secondsToNext -= 1;
  if (secondsToNext <= 0){
    doRefresh(false);
    return;
  }
  const m = Math.floor(secondsToNext/60);
  const s = secondsToNext % 60;
  document.getElementById('nextUpdate').textContent = `naechstes Update in ${m}:${s.toString().padStart(2,'0')}`;
}

/* ============================================================
   INIT
   ============================================================ */
document.getElementById('refreshBtn').addEventListener('click', () => doRefresh(true));

doRefresh(true);
countdownTimer = setInterval(tickCountdown, 1000);

// Beim Zurückkehren in den Tab/App sofort aktualisieren, falls länger weg
let lastVisible = Date.now();
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible'){
    const away = Date.now() - lastVisible;
    if (away > AUTO_REFRESH_MS){
      doRefresh(false);
    }
  } else {
    lastVisible = Date.now();
  }
});
</script>
