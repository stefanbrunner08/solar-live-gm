<!DOCTYPE html><html lang="de"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Solar Live</title><style>body{font-family:Segoe UI,sans-serif;background:#0b1f1a;color:#fff;max-width:500px;margin:auto;padding:20px} .card{background:#102b23;border-radius:20px;padding:20px;margin:12px 0} .big{font-size:48px;font-weight:700;text-align:center}.stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}.stat{background:#133328;padding:12px;border-radius:12px;text-align:center}.lbl{color:#8fb3a3;font-size:12px}.err{color:#ffb3a3}</style></head><body><h2>☀️ Solar Live</h2><div id="plant">Lade...</div><div class="card"><div class="lbl">Aktuelle Leistung</div><div class="big" id="power">--</div></div><div class="stats"><div class="stat"><div id="today">--</div><div class="lbl">Heute</div></div><div class="stat"><div id="month">--</div><div class="lbl">Monat</div></div><div class="stat"><div id="total">--</div><div class="lbl">Gesamt</div></div></div><p id="updated"></p><p class="err" id="err"></p><script>const DIRECT_URL='/.netlify/functions/solar';function unescapeHtml(s){return s.replace(/&quot;/g,'"').replace(/&amp;/g,'&').replace(/&lt;/g,'<').replace(/&gt;/g,'>')}async function load(){try{const r=await fetch(DIRECT_URL);const t=await r.text();const outer=JSON.parse(t);const d=JSON.parse(unescapeHtml(outer.data));document.getElementById('plant').textContent=d.stationOverview?.stationName||'PV-Anlage';document.getElementById('power').textContent=(d.realKpi?.realTimePower||0)+' kW';document.getElementById('today').textContent=(d.realKpi?.dailyEnergy||0)+' kWh';document.getElementById('month').textContent=(d.realKpi?.monthEnergy||0)+' kWh';document.getElementById('total').textContent=(d.realKpi?.cumulativeEnergy||0)+' kWh';document.getElementById('updated').textContent='Aktualisiert: '+new Date().toLocaleTimeString('de-DE');}catch(e){document.getElementById('err').textContent=e.message;}}load();setInterval(load,300000);</script></body></html>
